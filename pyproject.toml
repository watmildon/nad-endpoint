[project]
name = "nad-pipeline"
version = "0.1.0"
description = "Pipeline turning the USDOT National Address Database into OSM-ready address points"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5",
    "inflate64>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=9"]

[project.scripts]
nad = "nad_pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
